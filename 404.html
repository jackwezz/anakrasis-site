<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Anakrasis</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;background:#F4F3F0;color:#0D1430;font-family:"Instrument Sans",Helvetica,Arial,sans-serif}
  main{padding:0 clamp(18px,3vw,48px);max-width:900px}
  .lab{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#2340B0}
  h1{font-weight:400;font-size:clamp(32px,4vw,58px);line-height:1.08;letter-spacing:-.03em;margin:18px 0 32px}
  .line{display:flex;align-items:center;gap:18px}
  .line i{width:clamp(80px,20vw,260px);height:1.5px;background:#2340B0;position:relative}
  .line i::after{content:"";position:absolute;right:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:#C63B22}
  a{color:#0D1430;font-size:22px;text-decoration:none;padding-left:10px}
  a:hover{color:#2340B0}
</style>
</head>
<body>
<main>
  <span class="lab">404</span>
  <h1>Page not found.</h1>
  <div class="line"><i></i><a href="/" id="home">Back to the beginning →</a></div>
  <script>/* on <user>.github.io/<repo>/ the home is the first path segment */
    if (location.hostname.endsWith(".github.io")) document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";</script>
</main>
</body>
</html>
